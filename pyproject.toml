[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-openenv"
version = "0.1.0"
description = "A Meta + HuggingFace OpenEnv environments simulating clinical trial match-and-rank workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pytest>=7.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "app:start_server"

[tool.setuptools]
packages = ["."]

[tool.openenv]
entrypoint = "environment:ClinicalTrialEnv"
